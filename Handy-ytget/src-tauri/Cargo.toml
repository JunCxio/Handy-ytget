[package]
name = "handy-ytget"
version = "0.3.1"
edition = "2021"
description = "YouTube 视频桌面下载工具"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ytget = { path = "../../youtube-downloader" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy", "http2"] }
tokio = { version = "1", features = ["time", "macros"] }
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 8
panic = "abort"
